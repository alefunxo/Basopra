# BASOPRA input parameters.
# Edit the values below to customize your optimization run.

[BASOPRA]

# ILR is the DC capacity of the solar panels divided by the AC capacity of
# the inverter; leads to some energy being lost or clipped during the
# sunniest hours of the year.
Inverter_load_ratio = 1.2

# In some regions with substantial PV penetration, a feed-in limit is set
# above which PV power cannot be injected to the grid to keep grid stability.
Curtailment = 0.5

# Inverter efficiency (0-1]
Inverter_efficiency = 0.95

# Converter efficiency (0-1]
Converter_efficiency = 0.98

# Time resolution of the input data, in hours. Supported: 0.25, 0.5, 1
# (default is 0.25 i.e. 15-minutes)
Time_resolution = 0.25

# Number of years to be simulated (default is 1) in [1:]
number_of_years = 1

# Number of days to be simulated (default is 1) in [1:]
number_of_days = 100

# Size (in days) of each LP optimization window - the LP solves this many
# days jointly before re-optimizing on the next window (default is 7)
Optimization_window_days = 1

# 1 or 0 depending on whether the application is on or off
Avoidance_PV_curtailment = 1
Demand_load_shifting = 1
Demand_peak_shaving = 1

# Battery technology: NMC, NCA, LFP, LTO, VRLA or ALA
Technology = NMC

# Battery capacity, integer number different from 0
Capacity = 7

# Capacity tariff, in USD/kW/month
Capacity_tariff = 10.14

# PV system size in kWp
PV_nom = 5

# Year of the input data
year_data = 2015

# Timezone of the input data (must be a valid pytz timezone name)
time_zone = US/Central
